<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kampklar · Spillerhjelpen</title>
  <meta name="theme-color" content="#07110d">
  <link rel="stylesheet" href="kampklar.css">
</head>
<body>
<div id="app">
  <section id="start" class="screen active">
    <div class="topBar"><div onclick="window.location.href='index.html'">←</div></div>
    <div class="hero">
      <div class="icon">⚽</div>
      <div class="main">KAMPKLAR</div>
      <div class="sub">En enkel rutine fra dagen starter til du er klar for avspark.</div>
      <button id="startBtn">START RUTINEN</button>
    </div>
  </section>

  <section id="checklist" class="screen">
    <div class="topBar"><div id="backBtn">✕</div><div id="progress"></div></div>
    <div id="taskBox" class="card">
      <div id="time"></div>
      <div id="taskTitle"></div>
      <div id="taskDesc"></div>
    </div>
    <button id="doneBtn">FERDIG · NESTE</button>
    <div id="visualBox">🎯 Ta 1 min visualisering</div>
    <div id="tip"></div>
  </section>

  <section id="visual" class="screen">
    <div class="topBar"><div id="backFromVisual">✕</div><div id="vProgress"></div></div>
    <div id="vBox" class="card"><div id="vTitle"></div><div id="vText"></div></div>
    <button id="vNext">NESTE</button>
  </section>
</div>
<script src="kampklar.js"></script>
</body>
</html>
