<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamstring</title>
<link rel="stylesheet" href="hamstring.css">
</head>
<body>
<div id="app">
<section id="start" class="screen active">
  <div id="homeBack">←</div>
  <div class="hero">
    <h1>Hamstring</h1>
    <p class="intro">Typisk hamstringstrekk eller belastningssmerte i bakside lår kan bygges opp igjen med gradert styrke og løping.</p>
    <p class="intro small">Ved kraftig akutt skade eller smerte helt oppe ved sitteknuten: bruk sikkerhetssjekken først.</p>
  </div>
  <div class="menu">
    <button class="primary" onclick="startTest()"><strong>Test nivå</strong><br><span>Sikkerhetssjekk + finn riktig start</span></button>
    <button onclick="startPhase('pain')"><strong>Har vondt</strong><br><span>Rolig oppstart og tidlig belastning</span></button>
    <button onclick="startPhase('better')"><strong>Føles bedre</strong><br><span>Bygg styrke og start løpsprogresjon</span></button>
    <button onclick="startPhase('almost')"><strong>Tilbake mot fotball</strong><br><span>Styrke, fart og akselerasjon</span></button>
    <button onclick="startPhase('ready')"><strong>Testøkt</strong><br><span>Kontrollert test før lagtrening</span></button>
    <button onclick="startPhase('prevent')"><strong>Forebygging</strong><br><span>Styrke og høyfartseksponering</span></button>
  </div>
</section>
<section id="workout" class="screen">
  <div id="backBtn">✕</div>
  <div id="levelHeader"><div id="levelBig"></div><div id="levelSmall"></div></div>
  <div class="progressWrap"><div id="step"></div></div>
  <div id="testHeader" class="testHeader"><div id="testTitle" class="testTitle"></div><div id="testProgress" class="testProgress"></div></div>
  <div class="card" id="exerciseBox"><h2 id="title"></h2><p id="desc"></p></div>
  <div id="hint">Trykk på kortet for forklaring</div>
  <button id="next">START</button>
  <button id="yesBtn" style="display:none;">JA</button>
  <button id="noBtn" style="display:none;">NEI</button>
  <div id="tip"></div>
</section>
<div id="modal" class="modal"><div class="modalContent"><p id="modalText"></p></div></div>
</div>
<script src="rehab-core.js"></script>
<script src="hamstring.js"></script>
</body>
</html>
