<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kne</title>
<link rel="stylesheet" href="kne.css">
</head>
<body>
<div id="app">
<section id="start" class="screen active">
  <div id="homeBack">←</div>
  <div class="hero">
    <h1>Kne</h1>
    <p class="intro">For gradvis belastningsrelatert smerte foran eller rundt kneskålen ved løping, hopping, trapper eller mye trening.</p>
    <p class="intro small">Ikke bruk dette opplegget for akutt vridning, stor hevelse, låsing eller et kne som svikter.</p>
  </div>
  <div class="menu">
    <button class="primary" onclick="startTest()"><strong>Test nivå</strong><br><span>Sikkerhetssjekk + finn riktig start</span></button>
    <button onclick="startPhase('pain')"><strong>Har vondt</strong><br><span>Juster belastning og start rolig styrke</span></button>
    <button onclick="startPhase('better')"><strong>Føles bedre</strong><br><span>Bygg kne- og hoftestyrke</span></button>
    <button onclick="startPhase('almost')"><strong>Tilbake mot fotball</strong><br><span>Løp, hopp og retningsendring</span></button>
    <button onclick="startPhase('ready')"><strong>Testøkt</strong><br><span>Kontrollert test før lagtrening</span></button>
    <button onclick="startPhase('prevent')"><strong>Forebygging</strong><br><span>Styrke, landing og flerkomponent oppvarming</span></button>
  </div>
</section>
<section id="workout" class="screen">
  <div id="backBtn">✕</div>
  <div id="levelHeader"><div id="levelBig"></div><div id="levelSmall"></div></div>
  <div class="progressWrap"><div id="step"></div></div>
  <div id="testHeader" class="testHeader"><div id="testTitle" class="testTitle"></div><div id="testProgress" class="testProgress"></div></div>
  <div class="card" id="exerciseBox"><h2 id="title"></h2><p id="desc"></p></div>
  <div id="hint">Trykk på kortet for forklaring</div>
  <button id="next">START</button>
  <button id="yesBtn" style="display:none;">JA</button>
  <button id="noBtn" style="display:none;">NEI</button>
  <div id="tip"></div>
</section>
<div id="modal" class="modal"><div class="modalContent"><p id="modalText"></p></div></div>
</div>
<script src="rehab-core.js"></script>
<script src="kne.js"></script>
</body>
</html>
