<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legg</title>
<link rel="stylesheet" href="legg.css?v=20260825c">
</head>
<body>
<div id="app">
<section id="start" class="screen active">
  <div id="homeBack">←</div>
  <div class="hero">
    <h1>Legg</h1>
    <p class="intro">For typisk muskelstrekk eller belastningssmerte i leggen etter løping og fotball.</p>
    <p class="intro small">Krampe, muskelskade og uforklarlig hevelse er ikke det samme. Start med sikkerhetssjekken hvis du er usikker.</p>
  </div>
  <div class="menu">
    <button class="primary" onclick="startTest()"><strong>Test nivå</strong><br><span>Sikkerhetssjekk + finn riktig start</span></button>
    <button onclick="startPhase('pain')"><strong>Har vondt</strong><br><span>Rolig oppstart for muskulær leggsmerte</span></button>
    <button onclick="startPhase('better')"><strong>Føles bedre</strong><br><span>Bygg leggstyrke og gå mot jogging</span></button>
    <button onclick="startPhase('almost')"><strong>Tilbake mot fotball</strong><br><span>Hopp, løp og akselerasjon</span></button>
    <button onclick="startPhase('ready')"><strong>Testøkt</strong><br><span>Kontrollert test før lagtrening</span></button>
    <button onclick="startPhase('prevent')"><strong>Forebygging</strong><br><span>Leggkapasitet, spenst og belastningsstyring</span></button>
  </div>
</section>
<section id="workout" class="screen">
  <div id="backBtn">✕</div>
  <div id="levelHeader"><div id="levelBig"></div><div id="levelSmall"></div></div>
  <div class="progressWrap"><div id="step"></div></div>
  <div id="testHeader" class="testHeader"><div id="testTitle" class="testTitle"></div><div id="testProgress" class="testProgress"></div></div>
  <div class="card" id="exerciseBox"><h2 id="title"></h2><p id="desc"></p></div>
  <div id="hint">Trykk på kortet for forklaring</div>
  <button id="next">START</button>
  <button id="yesBtn" style="display:none;">JA</button>
  <button id="noBtn" style="display:none;">NEI</button>
  <div id="tip"></div>
</section>
<div id="modal" class="modal"><div class="modalContent"><p id="modalText"></p></div></div>
</div>
<script src="rehab-core.js?v=20260825c"></script>
<script src="legg.js?v=20260825c"></script>
</body>
</html>
